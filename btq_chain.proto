syntax = "proto3";

package weebi.chain;

import "boutique.proto";
import "common/g_timestamp.proto";

/// a Chain, Chaîne de magasins  
/// is a group of boutiques that share the same article catalog and contact directory
/// by default a firm has one chain with one boutique

// today devices are handled at the chains level, not the boutiques
// but it is counterintuitive
// will change tomorrow
// but it reflects the fact that from a device I can jump to different boutiques
/// boutique A : food - chain 1
/// boutique B : beauty - chain 2
/// boutique C : cosmetics - chain 3

/// boutique B & C merge (acquisition or in fact belang to the same compagny all along)
/// boutique C now belongs to chain 2

/// boutique A : alimentation - chain 1
/// boutique B : beauty - chain 2
/// boutique C : cosmetics - chain 2



message Chain {
  string chainId = 1 [json_name = 'chainId'];
  string firmId = 2 [json_name = 'firmId'];
  string name = 3 [json_name = 'name'];
  repeated weebi.boutique.BoutiqueMongo boutiques = 4 [json_name = 'boutiques'];
  google.protobuf.Timestamp creationDateUTC = 5 [json_name = 'creationDateUTC'];
  google.protobuf.Timestamp lastUpdateTimestampUTC = 6 [json_name = 'lastUpdateTimestampUTC'];;
  string lastUpdatedByuserId = 7 [json_name = 'lastUpdatedByuserId'];
  bool isDeleted = 8 [json_name = 'isDeleted'];
  string deletedBy = 9 [json_name = 'deletedBy']; // userId who deleted it
  string restoredBy = 10 [json_name = 'restoredBy']; // userId who restored it (empty if never restored)
  /// ISO 4217; overrides firm default_currency for boutiques in this chain when boutique.currency is empty.
  optional string currency = 11 [json_name = 'currency'];
  optional bool isDualCurrencyEnabled = 12 [json_name = 'isDualCurrencyEnabled'];
  optional string secondaryDisplayCurrency = 13 [json_name = 'secondaryDisplayCurrency'];
  optional weebi.boutique.BusinessRules businessRules = 14 [json_name = 'businessRules'];
  /// Soft-closed calendar years for SMT (waterfall with firm + boutique).
  repeated weebi.boutique.ClosedYearPb closed_years = 15 [json_name = 'closedYears'];
  /// RCCM / registre de commerce (optional; required at SMT year close).
  optional string commercial_register_number = 16 [json_name = 'commercialRegisterNumber'];
  /// SMT regime A/B/C; unknown defaults to négoce ceiling.
  optional weebi.boutique.CommerceTypePb commerce_type = 17 [json_name = 'commerceType'];
  /// ISIC code from the chosen classification (string; may keep leading zeros).
  optional string isic_code = 18 [json_name = 'isicCode'];
  /// Weebi refinement when several activities share the same ISIC.
  optional string isic_sub_code = 19 [json_name = 'isicSubCode'];
  reserved 20 to 100;
}

message Chains {
  repeated Chain chains = 1 [json_name = 'chains']; 
}

